version: '3'

tasks:

  upload-files-to-internal-named-stage:
    desc: Uploads all files from the given directory to a Snowflake Internal stage using the Snowflake CLI and PUT command.
    cmds:
      - python3 ./tasks/snow-cli/pyutil/snowcliput/snowcliput.py "{{.FILE_UPLOAD_DIR}}" "{{.CLI_CONNECTION_NAME}}" "{{.INTERNAL_NAMED_STAGE}}"

  deploy-dcm-project:
    desc: Runs the full DCM deployment lifecycle (pre-deploy, deploy, post-deploy) to stand up the required Snowflake infrastructure.
    cmds:
      - snow sql -f "{{.DCM_PROJECT_PATH}}/pre_deploy.sql" -c "{{.CLI_CONNECTION_NAME}}" --role ACCOUNTADMIN
      - snow dcm create "{{.DCM_PROJECT_IDENTIFIER}}" --if-not-exists -c "{{.CLI_CONNECTION_NAME}}" --database "{{.DCM_DATABASE}}"
      - cd "{{.DCM_PROJECT_PATH}}" && snow dcm deploy "{{.DCM_PROJECT_IDENTIFIER}}" -c "{{.CLI_CONNECTION_NAME}}" --database "{{.DCM_DATABASE}}"
      - snow sql -f "{{.DCM_PROJECT_PATH}}/post_deploy.sql" -c "{{.CLI_CONNECTION_NAME}}" --role SYSADMIN

  purge-dcm-project:
    desc: Drops every Snowflake object managed by the DCM project (database, schemas, tables, warehouses, roles, grants, file formats, and stages). The DCM project object itself is retained.
    cmds:
      - cd "{{.DCM_PROJECT_PATH}}" && snow dcm purge "{{.DCM_PROJECT_IDENTIFIER}}" -c "{{.CLI_CONNECTION_NAME}}" --database "{{.DCM_DATABASE}}" --force
